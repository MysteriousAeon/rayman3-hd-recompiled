0x821DFFD0 = { size = 0x20 }  # small dispatcher: cmp/beq/bnelr/b ... blr
0x824A58C0 = { size = 0x4 }   # b 0x824A2E38
0x824A3C48 = { size = 0x4 }   # b 0x824A2E38
0x824A6BF8 = { size = 0x4 }   # b 0x824A2E38

